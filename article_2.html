<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="https://raw.githubusercontent.com/KaysenTang/KaysenTang.github.io/main/Logo.jpg">
    <style>
        body {
            background-image: url('https://raw.githubusercontent.com/KaysenTang/KaysenTang.github.io/main/Background.JPG');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

      .glass-effect {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 1.5rem;
            transition: background 0.3s ease;
        }

      .glass-effect:hover {
            background: rgba(255, 255, 255, 0.4);
        }

      .clickable-glass {
            padding: 0.5rem 1rem;
            text-decoration: none;
            color: inherit;
            display: inline-block;
            border-radius: 1.5rem;
            transition: all 0.3s ease;
        }

      .clickable-glass:hover {
            transform: scale(1.05);
        }

      .animate-fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        nav.sticky {
            top: 10px;
        }
    </style>
    <title>文章标题 1</title>
</head>

<body class="font-sans flex flex-col min-h-screen">
    <!-- 导航栏 -->
    <nav class="glass-effect shadow-md sticky top-0 z-10 mx-4 my-2 p-4 animate-fade-in">
        <div class="container mx-auto flex justify-between items-center">
            <div class="text-xl font-bold pl-2">Kaysen Tang的博客</div>
            <div class="flex space-x-4 pr-2">
                <a href="#" class="clickable-glass glass-effect text-gray-600 hover:text-gray-900">主页</a>
            </div>
        </div>
    </nav>

    <!-- 主体内容 -->
    <div class="container mx-auto px-4 py-8 md:flex md:space-x-8 flex-grow">
        <!-- 用户信息 -->
        <div class="glass-effect shadow-md rounded-lg p-6 mb-8 md:mb-0 md:w-1/3 animate-fade-in">
            <div class="flex flex-col items-center space-y-4">
                <img src="https://raw.githubusercontent.com/KaysenTang/KaysenTang.github.io/main/Logo.jpg" alt="用户头像" class="rounded-full w-20 h-20">
                <div class="text-center">
                    <h2 class="text-2xl font-bold">Kaysen Tang</h2>
                    <p class="text-gray-600">来自 中国杭州</p>
                </div>
                <div class="flex space-x-4">
                    <a href="https://github.com/KaysenTang/" class="clickable-glass glass-effect bg-blue-500/30 hover:bg-blue-600/40 text-white py-2 px-4 rounded whitespace-nowrap">GitHub主页</a>
                    <a href="mailto:kaysen.tang@foxmail.com" class="clickable-glass glass-effect bg-gray-300/30 hover:bg-gray-400/40 text-gray-700 py-2 px-4 rounded whitespace-nowrap">联系我</a>
                </div>
            </div>
        </div>

        <!-- 文章详情 -->
        <div class="glass-effect shadow-md rounded-lg p-6 md:w-2/3 animate-fade-in">
            <div class="mb-4">
                <h2 class="text-2xl font-bold">文章标题 1</h2>
                <p class="text-gray-600">发布于 2025 年 4 月 2 日</p>
            </div>
            <p class="mt-2">这里是文章的详细内容。文章详细内容通常会包含更多的段落信息。文章的结尾部分可以对文章内容进行总结或者提出一些思考。</p>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="glass-effect shadow-md mx-4 my-2 p-3 text-center text-gray-600 animate-fade-in">
        <div class="container mx-auto">
            &copy; 2025 Kaysen Tang。保留所有权利。
        </div>
    </footer>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('https://picsum.photos/1920/1080');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

      .glass-effect {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 1.5rem;
            transition: background 0.3s ease;
        }

      .glass-effect:hover {
            background: rgba(255, 255, 255, 0.4);
        }

      .clickable-glass {
            padding: 0.5rem 1rem;
            text-decoration: none;
            color: inherit;
            display: inline-block;
            border-radius: 1.5rem;
        }
    </style>
    <title>个人博客</title>
</head>

<body class="font-sans flex flex-col min-h-screen">
    <!-- 导航栏 -->
    <nav class="glass-effect shadow-md sticky top-0 z-10 mx-4 my-2 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <div class="text-xl font-bold pl-2">个人博客</div>
            <div class="flex space-x-4 pr-2">
                <a href="#" class="clickable-glass glass-effect text-gray-600 hover:text-gray-900">主页</a>
            </div>
        </div>
    </nav>

    <!-- 主体内容 -->
    <div class="container mx-auto px-4 py-8 md:flex md:space-x-8 flex-grow">
        <!-- 用户信息 -->
        <div class="glass-effect shadow-md rounded-lg p-6 mb-8 md:mb-0 md:w-1/3">
            <div class="flex flex-col items-center space-y-4">
                <img src="https://picsum.photos/100/100" alt="用户头像" class="rounded-full w-20 h-20">
                <div class="text-center">
                    <h2 class="text-2xl font-bold">用户名</h2>
                    <p class="text-gray-600">这是个人简介。</p>
                </div>
                <div class="flex space-x-4">
                    <a href="#" class="clickable-glass glass-effect bg-blue-500/30 hover:bg-blue-600/40 text-white py-2 px-4 rounded whitespace-nowrap">GitHub主页</a>
                    <a href="#" class="clickable-glass glass-effect bg-gray-300/30 hover:bg-gray-400/40 text-gray-700 py-2 px-4 rounded whitespace-nowrap">联系我</a>
                </div>
            </div>
        </div>

        <!-- 博客文章列表 -->
        <div class="glass-effect shadow-md rounded-lg p-6 md:w-2/3">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-2xl font-bold">最新文章</h2>
                <a href="#" class="clickable-glass glass-effect text-blue-500 hover:text-blue-600 hover:underline">查看全部</a>
            </div>
            <div class="space-y-4">
                <!-- 文章卡片 -->
                <div class="border-b border-gray-300 pb-4">
                    <div>
                        <h3 class="text-lg font-bold">文章标题 1</h3>
                        <p class="text-gray-600">发布于 2025 年 4 月 2 日</p>
                    </div>
                    <p class="mt-2">这是文章的简短摘要。</p>
                    <p class="mt-2">
                        <a href="#" class="clickable-glass glass-effect text-blue-500 hover:text-blue-600 hover:underline">阅读全文</a>
                    </p>
                </div>
                <!-- 更多文章卡片 -->
                <div class="border-b border-gray-300 pb-4">
                    <div>
                        <h3 class="text-lg font-bold">文章标题 2</h3>
                        <p class="text-gray-600">发布于 2025 年 4 月 1 日</p>
                    </div>
                    <p class="mt-2">这是另一篇文章的简短摘要。</p>
                    <p class="mt-2">
                        <a href="#" class="clickable-glass glass-effect text-blue-500 hover:text-blue-600 hover:underline">阅读全文</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="glass-effect shadow-md mx-4 my-2 p-3 text-center text-gray-600">
        <div class="container mx-auto">
            &copy; 2025 个人博客。保留所有权利。
        </div>
    </footer>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Material 3 CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --md-sys-color-primary: #6750a4;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #eaddff;
            --md-sys-color-on-primary-container: #21005d;
            --md-sys-color-secondary: #625b71;
            --md-sys-color-on-secondary: #ffffff;
            --md-sys-color-secondary-container: #e8def8;
            --md-sys-color-on-secondary-container: #1e192b;
            --md-sys-color-surface: #fffbfe;
            --md-sys-color-on-surface: #1c1b1f;
            --md-sys-color-surface-variant: #e7e0ec;
            --md-sys-color-on-surface-variant: #49454f;
            --md-sys-color-error: #b3261e;
            --md-sys-color-on-error: #ffffff;
            --md-sys-color-outline: #79747e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
            letter-spacing: 0.01em;
        }

        body {
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background-color: var(--md-sys-color-surface);
            border-radius: 24px;
            box-shadow: 
                0 4px 8px rgba(0, 0, 0, 0.1),
                0 2px 4px rgba(0, 0, 0, 0.08);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .login-header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .login-title {
            font-size: 28px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface);
            text-align: center;
            letter-spacing: 0.015em;
        }

        .login-subtitle {
            font-size: 16px;
            font-weight: 400;
            color: var(--md-sys-color-on-surface-variant);
            text-align: center;
            letter-spacing: 0.02em;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface);
            letter-spacing: 0.025em;
        }

        .text-field {
            position: relative;
        }

        .text-field input {
            width: 100%;
            height: 56px;
            padding: 16px 16px 16px 48px;
            border: 1px solid var(--md-sys-color-outline);
            border-radius: 12px;
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .text-field input:focus {
            outline: none;
            border-color: var(--md-sys-color-primary);
            box-shadow: 0 0 0 2px rgba(103, 80, 164, 0.2);
        }

        .text-field .material-icons {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--md-sys-color-on-surface-variant);
            font-size: 24px;
        }

        .error-message {
            color: var(--md-sys-color-error);
            font-size: 14px;
            margin-top: 4px;
            text-align: center;
            letter-spacing: 0.02em;
        }

        .login-button {
            min-height: 56px;
            min-width: 120px;
            padding: 16px 24px;
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .login-button:hover {
            background-color: #5b479a;
        }

        .login-button:active {
            background-color: #4a3880;
        }

        .login-button:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(103, 80, 164, 0.2);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 8px 0;
        }

        .divider hr {
            flex: 1;
            height: 1px;
            border: none;
            background-color: var(--md-sys-color-outline);
        }

        .divider span {
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
            letter-spacing: 0.03em;
        }

        .guest-login {
            min-height: 56px;
            min-width: 120px;
            padding: 16px 24px;
            background-color: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-on-surface-variant);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .guest-login:hover {
            background-color: #d9d2e9;
        }

        .guest-login:active {
            background-color: #cbc4d8;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px;
                border-radius: 16px;
            }
            
            .login-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="login-title">Welcome</div>
            <div class="login-subtitle">Sign in to continue</div>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <div class="text-field">
                    <i class="material-icons">person</i>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
            </div>
            <br>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="text-field">
                    <i class="material-icons">lock</i>
                    <input type="password" id="password" name="password" required>
                </div>
            </div>

            {% if error %}
                <div class="error-message">{{ error }}</div>
            {% endif %}

            <button type="submit" class="login-button">
                <i class="material-icons">login</i>
                Sign in
            </button>
        </form>

        <div class="divider">
            <hr>
            <span>or</span>
            <hr>
        </div>

        <button class="guest-login" onclick="document.getElementById('username').value='user'; document.getElementById('password').value='userpass';">
            Use guest account
        </button>
    </div>

    <script>
        // 自动填充功能
        document.addEventListener('DOMContentLoaded', function() {
            // 为输入框添加焦点效果
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.classList.add('focused');
                });
                input.addEventListener('blur', function() {
                    this.parentElement.classList.remove('focused');
                });
            });
        });
    </script>
</body>
</html>

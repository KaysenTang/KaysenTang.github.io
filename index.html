<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <title>个人博客</title>
</head>

<body class="bg-gray-100 font-sans flex flex-col min-h-screen">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-md sticky top-0 z-10">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="text-xl font-bold">个人博客</div>
            <div class="flex space-x-4">
                <a href="#" class="text-gray-600 hover:text-gray-900">主页</a>
                <a href="#" class="text-gray-600 hover:text-gray-900">关于我</a>
                <a href="#" class="text-gray-600 hover:text-gray-900">联系我</a>
            </div>
        </div>
    </nav>

    <!-- 主体内容 -->
    <div class="container mx-auto px-4 py-8 md:flex md:space-x-8 flex-grow">
        <!-- 用户信息 -->
        <div class="bg-white shadow-md rounded-lg p-6 mb-8 md:mb-0 md:w-1/3">
            <div class="flex flex-col items-center space-y-4">
                <img src="https://picsum.photos/100/100" alt="用户头像" class="rounded-full w-20 h-20">
                <div class="text-center">
                    <h2 class="text-2xl font-bold">用户名</h2>
                    <p class="text-gray-600">这是个人简介。</p>
                </div>
                <div class="flex space-x-4">
                    <button class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded">关注</button>
                    <button class="bg-gray-300 hover:bg-gray-400 text-gray-700 py-2 px-4 rounded">发消息</button>
                </div>
            </div>
        </div>

        <!-- 博客文章列表 -->
        <div class="bg-white shadow-md rounded-lg p-6 md:w-2/3">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-2xl font-bold">最新文章</h2>
                <a href="#" class="text-blue-500 hover:underline">查看全部</a>
            </div>
            <div class="space-y-4">
                <!-- 文章卡片 -->
                <div class="border-b border-gray-300 pb-4">
                    <div class="flex items-center space-x-4">
                        <img src="https://picsum.photos/50/50" alt="作者头像" class="rounded-full w-12 h-12">
                        <div>
                            <h3 class="text-lg font-bold">文章标题 1</h3>
                            <p class="text-gray-600">发布于 2025 年 4 月 2 日</p>
                        </div>
                    </div>
                    <p class="mt-2">这是文章的简短摘要。</p>
                    <a href="#" class="text-blue-500 hover:underline">阅读全文</a>
                </div>
                <!-- 更多文章卡片 -->
                <div class="border-b border-gray-300 pb-4">
                    <div class="flex items-center space-x-4">
                        <img src="https://picsum.photos/50/50" alt="作者头像" class="rounded-full w-12 h-12">
                        <div>
                            <h3 class="text-lg font-bold">文章标题 2</h3>
                            <p class="text-gray-600">发布于 2025 年 4 月 1 日</p>
                        </div>
                    </div>
                    <p class="mt-2">这是另一篇文章的简短摘要。</p>
                    <a href="#" class="text-blue-500 hover:underline">阅读全文</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-3 text-center text-gray-600">
            &copy; 2025 个人博客。保留所有权利。
        </div>
    </footer>
</body>

</html>

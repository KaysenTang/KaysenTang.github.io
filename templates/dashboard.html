<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    Dashboard - Material 3
    <!-- Material 3 CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --md-sys-color-primary: #6750a4;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #eaddff;
            --md-sys-color-on-primary-container: #21005d;
            --md-sys-color-secondary: #625b71;
            --md-sys-color-on-secondary: #ffffff;
            --md-sys-color-secondary-container: #e8def8;
            --md-sys-color-on-secondary-container: #1e192b;
            --md-sys-color-surface: #fffbfe;
            --md-sys-color-on-surface: #1c1b1f;
            --md-sys-color-surface-variant: #e7e0ec;
            --md-sys-color-on-surface-variant: #49454f;
            --md-sys-color-error: #b3261e;
            --md-sys-color-on-error: #ffffff;
            --md-sys-color-outline: #79747e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
            letter-spacing: 0.01em;
        }

        body {
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .dashboard-card {
            background-color: var(--md-sys-color-surface);
            border-radius: 24px;
            box-shadow: 
                0 4px 8px rgba(0, 0, 0, 0.1),
                0 2px 4px rgba(0, 0, 0, 0.08);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .dashboard-header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface);
            text-align: center;
            letter-spacing: 0.01em;
        }

        .welcome-subtitle {
            font-size: 18px;
            font-weight: 400;
            color: var(--md-sys-color-on-surface-variant);
            text-align: center;
            letter-spacing: 0.02em;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 24px;
            background-color: var(--md-sys-color-primary-container);
            border-radius: 16px;
            color: var(--md-sys-color-on-primary-container);
        }

        .user-avatar {
            width: 80px;
            height: 80px;
            background-color: var(--md-sys-color-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--md-sys-color-on-primary);
            font-size: 40px;
            font-weight: 500;
        }

        .user-name {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 0.015em;
        }

        .user-role {
            font-size: 14px;
            color: var(--md-sys-color-on-primary-container);
            opacity: 0.8;
            letter-spacing: 0.025em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
        }

        .stat-card {
            background-color: var(--md-sys-color-surface-variant);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-title {
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
            letter-spacing: 0.03em;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface);
            letter-spacing: 0.01em;
        }

        .logout-button {
            min-height: 56px;
            min-width: 120px;
            padding: 16px 24px;
            background-color: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-on-surface-variant);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            text-decoration: none;
        }

        .logout-button:hover {
            background-color: #d9d2e9;
        }

        .logout-button:active {
            background-color: #cbc4d8;
        }

        .logout-button:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(103, 80, 164, 0.2);
        }

        @media (max-width: 480px) {
            .dashboard-card {
                padding: 24px;
                border-radius: 16px;
            }
            
            .welcome-title {
                font-size: 28px;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-card">
        <div class="dashboard-header">
            <div class="welcome-title">Welcome Back!</div>
            <div class="welcome-subtitle">You have successfully logged in</div>
        </div>

        <div class="user-info">
            <div class="user-avatar">{{ username[0].upper() }}</div>
            <div class="user-name">{{ username }}</div>
            <div class="user-role">Authenticated User</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Account Status</div>
                <div class="stat-value">Active</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Login Time</div>
                <div class="stat-value" id="loginTime"></div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Session ID</div>
                <div class="stat-value" id="sessionId"></div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Access Level</div>
                <div class="stat-value">User</div>
            </div>
        </div>

        <a href="{{ url_for('logout') }}" class="logout-button">
            <i class="material-icons">logout</i>
            Sign out
        </a>
    </div>

    <script>
        // 获取当前时间
        function formatDate(date) {
            const options = { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            return date.toLocaleDateString('en-US', options);
        }

        // 设置登录时间
        document.getElementById('loginTime').textContent = formatDate(new Date());

        // 生成随机会话ID（演示用）
        function generateSessionId() {
            return Math.random().toString(36).substring(2, 10).toUpperCase();
        }

        document.getElementById('sessionId').textContent = generateSessionId();
    </script>
</body>
</html>
